<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
        }
        p {
            background-color: #f0f0f0;
            font-size: 20px;
            line-height: 1.8;
        }
        ol {
            color: #1b4f72;
            background-color: #ffcccc; /* Cor de fundo vermelho claro */
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.8;
            list-style-position: inside; /* Garante que os números (como III.) fiquem 100% dentro da cor de fundo */
        }
    </style>
</head>

<body>
    <p>Lista ordenada:</p>
    <ol type="1">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
    <ol type="a" start="2">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
    <ol type="A" start="5">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
    <ol type="i" reversed>
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
    <ol type="I" start="3" reversed>
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>            
</body>
</html>
